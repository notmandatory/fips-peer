{{- if and (not .Values.identity.existingSecret) .Values.identity.nsec }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fips.fullname" . }}
  labels:
    {{- include "fips.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.identity.secretKey }}: {{ .Values.identity.nsec | quote }}
{{- end }}
